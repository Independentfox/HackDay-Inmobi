apiVersion: v1
kind: Secret
metadata:
  name: ai-secret
  namespace: imdb
type: Opaque
stringData:
  # Optional. Set this before deploying if you want the /api/ai/* endpoints
  # to work. With the key unset, the rest of the API still functions normally
  # and /api/ai/* returns a clean 503.
  ANTHROPIC_API_KEY: ""
