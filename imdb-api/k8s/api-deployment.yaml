apiVersion: apps/v1
kind: Deployment
metadata:
  name: imdb-api
  namespace: imdb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: imdb-api
  template:
    metadata:
      labels:
        app: imdb-api
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          # Soft preference so Minikube's single node doesn't block scheduling.
          # On a multi-node cluster the API replicas will spread automatically.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: imdb-api
      containers:
        - name: imdb-api
          image: imdb-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: db-secret
            - configMapRef:
                name: app-config
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secret
                  key: ANTHROPIC_API_KEY
                  optional: true
          lifecycle:
            preStop:
              # Give the Service ~10s to drop this pod from rotation before
              # uvicorn starts shutting down. Combined with the 30s grace period,
              # in-flight requests have time to finish cleanly.
              exec:
                command: ["sh", "-c", "sleep 10"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
