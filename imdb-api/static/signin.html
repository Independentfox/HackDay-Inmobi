<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — CineDB</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg);
    }

    .signin-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      background:
        radial-gradient(circle at 20% 40%, rgba(245,197,24,0.06) 0%, transparent 55%),
        radial-gradient(circle at 80% 60%, rgba(232,82,58,0.05) 0%, transparent 50%);
    }

    .signin-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 44px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
    }

    .signin-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 8px;
      text-decoration: none;
    }
    .signin-logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold);
    }
    .signin-logo-icon { font-size: 1.8rem; }
    .signin-tagline {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 32px;
    }

    .auth-tabs {
      display: flex;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .auth-tab {
      flex: 1;
      padding: 9px;
      text-align: center;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 7px;
      transition: all 0.2s;
      border: none;
      background: none;
      font-family: inherit;
    }
    .auth-tab.active {
      background: var(--bg-4);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .auth-panel { display: none; }
    .auth-panel.active { display: block; }

    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    .form-input {
      width: 100%;
      background: var(--bg-3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245,197,24,0.12);
    }
    .form-input::placeholder { color: var(--text-muted); }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--gold);
      color: #0a0a0f;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, transform 0.1s;
      margin-top: 4px;
    }
    .btn-submit:hover { background: #e0b010; }
    .btn-submit:active { transform: scale(0.98); }

    .error-msg {
      background: rgba(232,82,58,0.1);
      border: 1px solid rgba(232,82,58,0.35);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.visible { display: block; }

    .switch-hint {
      text-align: center;
      font-size: 0.825rem;
      color: var(--text-muted);
      margin-top: 20px;
    }
    .switch-hint a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .switch-hint a:hover { color: var(--gold-dim); }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--text-dim); text-decoration: none; }
    footer a:hover { color: var(--text); }
  </style>
</head>
<body>

  <div class="signin-wrap">
    <div class="signin-card">
      <a href="/" class="signin-logo">
        <span class="signin-logo-icon">🎬</span>
        <span class="signin-logo-text">CineDB</span>
      </a>
      <p class="signin-tagline">Your cinema universe awaits</p>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Create Account</button>
      </div>

      <!-- SIGN IN PANEL -->
      <div class="auth-panel active" id="panel-signin">
        <div class="error-msg" id="signin-error"></div>
        <div class="form-group">
          <label class="form-label" for="signin-username">Username</label>
          <input class="form-input" id="signin-username" type="text" placeholder="Enter your username" autocomplete="username" />
        </div>
        <div class="form-group">
          <label class="form-label" for="signin-password">Password</label>
          <input class="form-input" id="signin-password" type="password" placeholder="Enter your password" autocomplete="current-password" onkeydown="if(event.key==='Enter') doSignIn()" />
        </div>
        <button class="btn-submit" onclick="doSignIn()">Sign In</button>
        <p class="switch-hint">
          Don't have an account? <a onclick="switchTab('register')">Create one</a>
        </p>
      </div>

      <!-- CREATE ACCOUNT PANEL -->
      <div class="auth-panel" id="panel-register">
        <div class="error-msg" id="register-error"></div>
        <div class="form-group">
          <label class="form-label" for="register-username">Username</label>
          <input class="form-input" id="register-username" type="text" placeholder="Choose a username" autocomplete="username" />
        </div>
        <div class="form-group">
          <label class="form-label" for="register-password">Password</label>
          <input class="form-input" id="register-password" type="password" placeholder="Choose a password" autocomplete="new-password" onkeydown="if(event.key==='Enter') doRegister()" />
        </div>
        <button class="btn-submit" onclick="doRegister()">Create Account</button>
        <p class="switch-hint">
          Already have an account? <a onclick="switchTab('signin')">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <footer>
    <a href="/docs">API Docs</a> &nbsp;·&nbsp; CineDB &copy; 2025
  </footer>

  <script>
    // Redirect if already signed in (only when the stored object looks like a real session)
    try {
      const stored = localStorage.getItem('cinedb_user');
      if (stored) {
        const u = JSON.parse(stored);
        if (u && u.id) window.location.replace('/');
        else localStorage.removeItem('cinedb_user');
      }
    } catch { localStorage.removeItem('cinedb_user'); }

    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
      document.getElementById(tab === 'signin' ? 'signin-error' : 'register-error').classList.remove('visible');
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('visible');
    }

    function setBusy(btn, busy, label) {
      btn.disabled = busy;
      btn.textContent = busy ? 'Please wait…' : label;
    }

    function storeSessionAndGoHome(user) {
      // Persist the full user object returned by the API ({id, username}).
      // initSession in app.js requires both fields.
      localStorage.setItem('cinedb_user', JSON.stringify({ id: user.id, username: user.username }));
      window.location.replace('/');
    }

    async function doSignIn() {
      const username = document.getElementById('signin-username').value.trim();
      const password = document.getElementById('signin-password').value;
      document.getElementById('signin-error').classList.remove('visible');

      if (!username) { showError('signin-error', 'Please enter your username.'); return; }
      if (!password) { showError('signin-error', 'Please enter your password.'); return; }

      const btn = document.querySelector('#panel-signin .btn-submit');
      setBusy(btn, true, 'Sign In');
      try {
        const res = await fetch('/api/users/signin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) { storeSessionAndGoHome(await res.json()); return; }
        if (res.status === 401) showError('signin-error', 'Invalid username or password.');
        else showError('signin-error', 'Sign in failed. Please try again.');
      } catch {
        showError('signin-error', 'Network error. Please try again.');
      } finally {
        setBusy(btn, false, 'Sign In');
      }
    }

    async function doRegister() {
      const username = document.getElementById('register-username').value.trim();
      const password = document.getElementById('register-password').value;
      document.getElementById('register-error').classList.remove('visible');

      if (!username) { showError('register-error', 'Please choose a username.'); return; }
      if (username.length < 3) { showError('register-error', 'Username must be at least 3 characters.'); return; }
      if (!password) { showError('register-error', 'Please choose a password.'); return; }
      if (password.length < 6) { showError('register-error', 'Password must be at least 6 characters.'); return; }

      const btn = document.querySelector('#panel-register .btn-submit');
      setBusy(btn, true, 'Create Account');
      try {
        const res = await fetch('/api/users/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) { storeSessionAndGoHome(await res.json()); return; }
        if (res.status === 409) showError('register-error', 'That username is taken. Try another.');
        else if (res.status === 422) showError('register-error', 'Please check your username and password.');
        else showError('register-error', 'Could not create account. Please try again.');
      } catch {
        showError('register-error', 'Network error. Please try again.');
      } finally {
        setBusy(btn, false, 'Create Account');
      }
    }
  </script>
</body>
</html>
